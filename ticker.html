<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CricHeroes Live Ticker</title>
<style>
  :root{
    /* sizes — a ?provider= preset shrinks these so long names fit */
    --barH:104px; --nm:24px; --rb:24px; --rbS:15px; --ini:18px;
    --logoW:96px; --logoImg:62px; --pillName:14px; --pillMax:128px; --score:26px; --ov:16px;

    /* CLASSIC theme (default) — translucent white broadcast bar */
    --bar-bg:rgba(255,255,255,.70); --bar-shadow:0 8px 26px rgba(0,0,0,.4);
    --name:#16181d; --sub:#7c828c; --strike:#f0682e;
    --sc-bg:#16181d; --sc-text:#fff; --sc-ov:#aeb6c2;
    --ab-a-bg:#e84a7f; --ab-a-text:#fff; --ab-a-inset:none;
    --ab-b-bg:#14b4a4; --ab-b-text:#fff; --ab-b-inset:none;
    --strip-bg:#262c70; --strip-text:#fff;
    --strip-chase-bg:#b0335c; --strip-chase-text:#fff;
    --ball-bg:#e7e9ee; --ball-text:#16181d; --ball-four:#14b4a4; --ball-six:#c879ff;
    --ball-wkt:#e23b3b; --ball-dot:#9097a3;
    --logo-bd:#e6e8ec;
    --pill-a:#d63b6e; --pill-b:#16b3a6; --scorebg:#11161d;
  }
  /* DARK theme — the original translucent bar (opt-in via ?theme=dark) */
  body.theme-dark{
    --bar-bg:linear-gradient(180deg,rgba(12,16,22,.82),rgba(12,16,22,.94));
    --bar-shadow:0 8px 28px rgba(0,0,0,.5);
    --name:#fff; --sub:#b9c6d4; --strike:#1e9e54;
    --sc-bg:var(--scorebg); --sc-text:#fff; --sc-ov:#b9c6d4;
    --ab-a-bg:var(--scorebg); --ab-a-text:#ff7aa3; --ab-a-inset:inset 4px 0 0 var(--pill-a);
    --ab-b-bg:var(--scorebg); --ab-b-text:#3fd9cb; --ab-b-inset:inset -4px 0 0 var(--pill-b);
    --strip-bg:transparent; --strip-text:#fff;
    --strip-chase-bg:transparent; --strip-chase-text:#ffe08a;
    --ball-bg:rgba(255,255,255,.16); --ball-text:#fff; --ball-dot:#b9c6d4;
    --logo-bd:rgba(255,255,255,.85);
  }
  /* Streamlabs/PRISM render the overlay narrow — compact type + logos */
  body.prov-streamlabs, body.prov-prism{
    --barH:88px; --nm:17px; --rb:18px; --rbS:12px; --ini:14px;
    --logoW:58px; --logoImg:42px; --pillName:11px; --pillMax:96px; --score:19px; --ov:12px;
  }
  body.prov-streamlabs .players, body.prov-prism .players{ padding:0 12px; gap:6px; }
  body.prov-streamlabs .pill .sc, body.prov-prism .pill .sc{ padding:6px 10px; gap:7px; }
  body.prov-streamlabs .pill .ab, body.prov-prism .pill .ab{ padding:5px 9px; }
  body.prov-streamlabs .ball, body.prov-prism .ball{ min-width:18px; height:18px; font-size:11px; }
  body.prov-streamlabs .csub, body.prov-prism .csub{ font-size:12px; margin-top:5px; }

  html,body{margin:0;height:100%;width:100%;overflow:hidden;background:transparent;
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}

  #bar{
    position:fixed; left:18px; right:18px; bottom:16px; height:var(--barH);
    display:flex; align-items:stretch; color:var(--name);
    background:var(--bar-bg); border-radius:20px; overflow:hidden;
    -webkit-backdrop-filter:blur(5px); backdrop-filter:blur(5px);
    box-shadow:var(--bar-shadow);
    transform:translateY(160%); transition:transform .45s ease;
  }
  #bar.show{ transform:translateY(0); }

  .logo{ width:var(--logoW); display:flex; align-items:center; justify-content:center; flex:none; }
  .logo img{ width:var(--logoImg); height:var(--logoImg); border-radius:50%; object-fit:cover;
             background:#fff; border:2px solid var(--logo-bd); }
  .logo .ini{ width:var(--logoImg); height:var(--logoImg); border-radius:50%; display:flex;
              align-items:center; justify-content:center; font-weight:800; font-size:var(--ini);
              color:#fff; border:2px solid var(--logo-bd); }
  .logo .ini.a{ background:var(--pill-a); } .logo .ini.b{ background:var(--pill-b); }

  .players{ flex:1; display:flex; flex-direction:column; justify-content:center;
            gap:9px; padding:0 18px; min-width:0; }
  .players.right{ align-items:flex-end; text-align:right; }
  .prow{ display:flex; align-items:baseline; gap:9px; white-space:nowrap; max-width:100%; min-width:0; }
  .prow .nm{ font-weight:700; font-size:var(--nm); color:var(--name); min-width:0;
             overflow:hidden; text-overflow:ellipsis; }
  .prow .rb{ font-weight:800; font-size:var(--rb); color:var(--name);
             font-variant-numeric:tabular-nums; flex:none; }
  .prow .rb small{ font-size:var(--rbS); color:var(--sub); font-weight:600; margin-left:3px; }
  .prow.dim{ opacity:.74; }
  .prow .strike{ color:var(--strike); font-size:var(--ini); margin-right:-5px; flex:none; }

  .balls{ display:flex; gap:5px; align-items:center; margin-top:3px; }
  .ball{ min-width:23px; height:23px; padding:0 4px; border-radius:50%;
         background:var(--ball-bg); color:var(--ball-text); font-size:12px; font-weight:700;
         display:flex; align-items:center; justify-content:center; box-sizing:border-box; }
  .ball.four{ background:var(--ball-four); color:#fff; }
  .ball.six{ background:var(--ball-six); color:#fff; }
  .ball.wkt{ background:var(--ball-wkt); color:#fff; }
  .ball.dot{ color:var(--ball-dot); }

  .center{ display:flex; flex-direction:column; align-items:center; justify-content:center;
           flex:none; padding:0 6px; }
  .pill{ display:flex; align-items:stretch; border-radius:12px; overflow:hidden;
         box-shadow:0 2px 10px rgba(0,0,0,.3); }
  .pill .ab{ padding:7px 12px; font-weight:800; font-size:var(--pillName); line-height:1.12;
             display:flex; align-items:center; text-align:center; max-width:var(--pillMax);
             white-space:normal; word-break:break-word; }
  .pill .ab.a{ background:var(--ab-a-bg); color:var(--ab-a-text); box-shadow:var(--ab-a-inset); }
  .pill .ab.b{ background:var(--ab-b-bg); color:var(--ab-b-text); box-shadow:var(--ab-b-inset); }
  .pill .sc{ background:var(--sc-bg); padding:8px 16px; display:flex; align-items:center; gap:10px; }
  .pill .sc .score{ font-weight:800; font-size:var(--score); color:var(--sc-text);
                    font-variant-numeric:tabular-nums; }
  .pill .sc .ov{ color:var(--sc-ov); font-weight:700; font-size:var(--ov); }
  .ctop{ margin-bottom:6px; font-size:12px; font-weight:800; letter-spacing:.5px; text-transform:uppercase;
         color:var(--strip-text); background:var(--strip-bg); border-radius:8px; padding:2px 12px;
         text-align:center; max-width:380px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ctop:empty{ display:none; }
  body.prov-streamlabs .ctop, body.prov-prism .ctop{ font-size:11px; margin-bottom:5px; }
  .csub{ margin-top:7px; font-size:13px; font-weight:700; letter-spacing:.4px; text-transform:uppercase;
         color:var(--strip-text); background:var(--strip-bg); border-radius:8px; padding:3px 12px;
         text-align:center; max-width:380px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .csub.chase{ color:var(--strip-chase-text); background:var(--strip-chase-bg); }
  .liveDot{ display:inline-block; width:8px; height:8px; border-radius:50%;
            background:var(--ball-wkt); margin-right:6px; vertical-align:1px; }

  /* ---- end-of-match full scorecard (always Classic palette) ---- */
  #scorecard{ position:fixed; inset:0; display:none; align-items:center; justify-content:center;
              padding:3vh 3vw; box-sizing:border-box; }
  #scorecard.show{ display:flex; }
  /* wicket / over splash: sits ABOVE the live bar (which stays visible) */
  #scorecard.splash{ align-items:center; padding-bottom:170px; }
  .sc-card{ width:min(1080px,94%); background:rgba(255,255,255,.72); border-radius:18px; overflow:hidden;
            -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px);
            box-shadow:0 16px 44px rgba(0,0,0,.5);
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
  .sc-head{ background:#262c70; color:#fff; display:flex; justify-content:space-between;
            align-items:center; padding:12px 22px; }
  .sc-head .t{ font-weight:800; font-size:17px; letter-spacing:.4px; }
  .sc-head .r{ opacity:.85; font-size:12px; text-transform:uppercase; font-weight:600; }
  .sc-result{ background:#e84a7f; color:#fff; text-align:center; padding:9px;
              font-weight:800; font-size:19px; letter-spacing:.3px; }
  .sc-note{ background:#14b4a4; color:#06231f; text-align:center; padding:8px;
            font-weight:800; font-size:18px; letter-spacing:.4px; text-transform:uppercase; }
  .sc-inn{ padding:14px 22px; border-bottom:1px solid rgba(20,24,29,.14); }
  .sc-tm{ display:flex; align-items:center; gap:12px; margin-bottom:9px; }
  .sc-tm img{ width:38px; height:38px; border-radius:50%; object-fit:cover; }
  .sc-tm .ini{ width:38px; height:38px; border-radius:50%; display:flex; align-items:center;
               justify-content:center; font-weight:800; font-size:13px; color:#fff; }
  .sc-tm .nm{ font-weight:800; font-size:17px; color:#16181d; flex:1; min-width:0;
              overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sc-tm .tot{ font-weight:800; font-size:20px; color:#262c70; flex:none; }
  .sc-cols{ display:flex; gap:26px; }
  .sc-bat,.sc-bowl{ flex:1; min-width:0; }
  .sc-h{ font-size:10px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; margin-bottom:3px; }
  .sc-bat .sc-h{ color:#e84a7f; } .sc-bowl .sc-h{ color:#14b4a4; }
  .sc-line{ display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:3px 0;
            border-bottom:1px solid rgba(20,24,29,.10); color:#16181d; }
  .sc-line .n{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sc-line .v{ font-weight:700; flex:none; }
  .sc-line .v small{ color:#7c828c; font-weight:600; font-size:11px; }

  /* ---- full-innings scorecard (all batters + bowling below) ---- */
  .sc-sec{ padding:10px 22px 12px; }
  .sc-sec + .sc-sec{ border-top:1px solid rgba(20,24,29,.14); }
  .sc-sech{ font-size:11px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; margin-bottom:2px; }
  .sc-sech.bat{ color:#e84a7f; } .sc-sech.bowl{ color:#14b4a4; }
  .sc-th,.sc-tr{ display:flex; align-items:baseline; gap:8px; }
  .sc-th{ font-size:10px; font-weight:800; color:#7c828c; text-transform:uppercase;
          letter-spacing:.5px; padding:3px 0; border-bottom:1px solid rgba(20,24,29,.18); }
  .sc-tr{ font-size:13px; color:#16181d; padding:2.5px 0; border-bottom:1px solid rgba(20,24,29,.08); }
  .sc-tr .pn{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:700; }
  .sc-th .pn{ flex:1; font-weight:800; }
  .sc-tr .pn small{ color:#7c828c; font-weight:600; font-size:11px; margin-left:6px; }
  .sc-tr .pn small.no{ color:#0f8d81; }
  .sc-c{ flex:none; width:32px; text-align:right; font-variant-numeric:tabular-nums; font-weight:700; }
  .sc-c.w{ width:50px; }
  .sc-xtr{ display:flex; justify-content:space-between; font-size:12px; color:#16181d;
           padding:4px 0 0; font-weight:700; }
  .sc-xtr .lbl{ color:#7c828c; text-transform:uppercase; font-size:10px; letter-spacing:.5px;
                font-weight:800; margin-right:8px; }
  .sc-ytb{ font-size:11px; color:#7c828c; padding-top:3px; white-space:nowrap;
           overflow:hidden; text-overflow:ellipsis; }
  .sc-ytb b{ color:#16181d; }

  /* ---- worm graph ---- */
  .sc-worm{ padding:12px 22px 16px; }
  .sc-worm .lg{ display:flex; gap:26px; margin-bottom:6px; }
  .sc-worm .lg span{ display:flex; align-items:center; gap:7px; font-size:11px; font-weight:800;
                     letter-spacing:.5px; text-transform:uppercase; color:#16181d; }
  .sc-worm .lg i{ width:12px; height:12px; border-radius:50%; display:inline-block; }
  .sc-worm svg{ width:100%; height:auto; display:block; }
</style>
</head>
<body>
  <div id="bar">
    <div class="logo" id="logoL"></div>
    <div class="players" id="bat"></div>
    <div class="center">
      <div class="ctop" id="ctop"></div>
      <div class="pill" id="pill"></div>
      <div class="csub" id="csub"></div>
    </div>
    <div class="players right" id="bowl"></div>
    <div class="logo" id="logoR"></div>
  </div>
  <div id="scorecard"></div>

<script>
(function(){
  // ---- one-time config: your deployed Cloudflare Worker proxy ----------
  var DEFAULT_API = "https://cricticker.tclnc.workers.dev/";

  var q       = new URLSearchParams(location.search);
  var matchId = q.get("id") || "25801383";
  var theme   = (q.get("theme") || "classic").toLowerCase().replace(/[^a-z]/g,"");
  var refresh = Math.max(5, parseInt(q.get("refresh")||"8",10))*1000;
  // Auto scorecard on wicket / end-of-over: shown for cardsecs seconds.
  var cardSecs = Math.max(5, parseInt(q.get("cardsecs")||"30",10))*1000;
  var autoCard = q.get("autocard") !== "0";
  var isLocal = /^(localhost|127\.|0\.0\.0\.0|\[::1\])/.test(location.hostname);
  var apiBase = q.get("api") || (isLocal ? "/api/" : DEFAULT_API);
  if (apiBase.slice(-1) !== "/") apiBase += "/";
  document.body.classList.add("theme-"+theme);

  // ?provider=streamlabs|prism -> compact type + abbreviate long names
  var prov = (q.get("provider")||"").toLowerCase().replace(/[^a-z]/g,"");
  var compact = (prov==="streamlabs"||prov==="prism");
  if (compact) document.body.classList.add("prov-"+prov);

  var $ = function(id){ return document.getElementById(id); };
  var bar = $("bar");

  // ?bg=<hex> recolours the DARK theme bar (Classic uses its fixed palette).
  function applyBg(hex){
    if (!hex || theme==="classic") return;
    hex = String(hex).replace(/^#/, "");
    if (!/^[0-9a-fA-F]{6}([0-9a-fA-F]{2})?$/.test(hex)) return;
    var r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
    var a = hex.length===8 ? parseInt(hex.slice(6,8),16)/255 : 0.82;
    var rgba=function(al){ return "rgba("+r+","+g+","+b+","+al.toFixed(3)+")"; };
    bar.style.background = "linear-gradient(180deg,"+rgba(a*0.85)+","+rgba(a)+")";
    var dk=function(c){ return Math.round(c*0.34); };
    document.documentElement.style.setProperty("--scorebg",
      "rgba("+dk(r)+","+dk(g)+","+dk(b)+",0.96)");
  }
  applyBg(q.get("bg") || (location.hash ? location.hash.slice(1) : ""));

  if (q.get("demo")==="1")
    document.body.style.background =
      "radial-gradient(120% 90% at 50% 0%, #2f5d33 0%, #16331b 55%, #0a1a0d 100%)";

  // ---- local team-logo manifest ----
  var LOGOS = {};
  function norm(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9]/g,""); }
  function logoSrc(team){
    var f = LOGOS[norm(team.name)];
    if (f) return "assets/team-logos/" + encodeURIComponent(f);
    return team.logo || null;
  }

  // ---- team -> division map (assets/tournaments/data/divisions.json) ----
  // Keyed by tournament_id; each has byId (team_id) and byName (normalised).
  var DIVMAP = {};
  function divisionOf(d, batT, bowT){
    var t = DIVMAP[String(d.tournament_id||"")];
    if (!t) return null;
    function look(team){
      if (!team) return null;
      if (t.byId && team.id!=null && t.byId[String(team.id)]!=null) return t.byId[String(team.id)];
      if (t.byName && t.byName[norm(team.name)]!=null) return t.byName[norm(team.name)];
      return null;
    }
    var v = look(batT); return v!=null ? v : look(bowT);
  }

  // wicket / end-of-over auto-scorecard state
  var seenInn=null, baseWkt=0, baseOver=0, cardUntil=0;
  function abbr(name, short){
    if (short && short.trim()) return short.trim().toUpperCase();
    var w = (name||"").trim().split(/\s+/);
    if (w.length >= 2) return (w[0][0]+w[1][0]).toUpperCase();
    return (name||"?").slice(0,3).toUpperCase();
  }
  function esc(s){ return (s==null?"":String(s)).replace(/[&<>]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }

  // Name fitting: in compact (streamlabs/prism) mode, names whose
  // first+last name is <=20 chars stay full; longer names become
  // "Firstname I. I." (full first name + initials of the rest).
  function fitName(name){
    var full = String(name||"").trim();
    if (!compact || full.length <= 20) return esc(full);
    var w = full.split(/\s+/);
    if (w.length < 2) return esc(full);
    return esc(w[0] + " " + w.slice(1).map(function(x){ return x[0].toUpperCase()+"."; }).join(" "));
  }

  function setLogo(elId, team, side){
    var el = $(elId), src = logoSrc(team), ab = abbr(team.name, team.short_name);
    if (!src){ el.innerHTML = '<div class="ini '+side+'">'+ab+'</div>'; return; }
    el.innerHTML = "";
    var img = new Image();
    img.alt = ab;
    img.onerror = function(){ el.innerHTML = '<div class="ini '+side+'">'+ab+'</div>'; };
    img.src = src;
    el.appendChild(img);
  }

  function batRow(p, striker){
    if (!p || !p.name) return "";
    return '<div class="prow'+(striker?'':' dim')+'">'
      + (striker?'<span class="strike">▶</span>':'')
      + '<span class="nm">'+fitName(p.name)+'</span>'
      + '<span class="rb">'+(p.runs||0)+'<small>('+(p.balls||0)+')</small></span></div>';
  }
  function bowlRow(b){
    if (!b || !b.name) return "";
    var figs = (b.wickets||0)+'-'+(b.runs||0);
    return '<div class="prow"><span class="nm">'+fitName(b.name)+'</span>'
      + '<span class="rb">'+figs+'<small>('+(b.overs!=null?b.overs:0)+')</small></span></div>';
  }
  function ballsHtml(recent){
    if (!recent) return "";
    var segs = String(recent).split("|");
    // last segment = current over; keep every delivery (wides/no-balls make it >6)
    var over = segs[segs.length-1].trim().split(/\s+/).filter(Boolean);
    return '<div class="balls">' + over.map(function(t){
      var u = t.toUpperCase(), cls="ball";
      if (u.indexOf("W")>=0 && u.indexOf("WD")<0) cls+=" wkt";
      else if (u==="4") cls+=" four";
      else if (u==="6") cls+=" six";
      else if (u==="0") cls+=" dot";
      return '<span class="'+cls+'">'+esc(t)+'</span>';
    }).join("") + '</div>';
  }

  function pick(d){
    var cur = d.current_inning || 1;
    function lastInn(t){ return (t.innings&&t.innings.length)?t.innings[t.innings.length-1]:{}; }
    var a=d.team_a, b=d.team_b, aInn=lastInn(a), bInn=lastInn(b);
    if (bInn.inning===cur) return {cur:cur, batT:b, bowT:a, batInn:bInn};
    return {cur:cur, batT:a, bowT:b, batInn:aInn};
  }

  function render(d){
    var p = pick(d);
    setLogo("logoL", p.batT, "a");
    setLogo("logoR", p.bowT, "b");

    var sb=(d.batsmen||{}).sb, nsb=(d.batsmen||{}).nsb;
    $("bat").innerHTML = batRow(sb,true) + batRow(nsb,false);

    var bw=(d.bowlers||{}).sb;
    $("bowl").innerHTML = bowlRow(bw) + ballsHtml(d.recent_over);

    var bi=p.batInn||{};
    var score=(bi.total_run!=null?bi.total_run:0)+'-'+(bi.total_wicket!=null?bi.total_wicket:0);
    var ov=bi.overs_played!=null?bi.overs_played:'0';
    $("pill").innerHTML =
        '<div class="ab a">'+esc(p.batT.name)+'</div>'
      + '<div class="sc"><span class="score">'+score+'</span><span class="ov">'+ov+' ov</span></div>'
      + '<div class="ab b">'+esc(p.bowT.name)+'</div>';

    // tournament + division ABOVE the pill
    var div = divisionOf(d, p.batT, p.bowT);
    $("ctop").innerHTML = esc(d.tournament_name||"") + (div!=null ? ' &nbsp;•&nbsp; Division '+div : '');

    // sub-strip BELOW: special event > 2nd-innings chase > first-innings label
    var ms=d.match_summary||{};
    var ev=(d.match_event_type||"").trim();
    var sub=$("csub"); sub.className="csub";
    if (ev && ev.toUpperCase()!=="LIVE"){
      sub.innerHTML='<span class="liveDot"></span>'+esc(ev.replace(/-/g," "));
    } else if (p.cur>=2 && (ms.ticker_summary||ms.required_run!=null)){
      sub.className="csub chase";
      var eq = ms.ticker_summary || ("Need "+ms.required_run+" in "+ms.required_ball);
      sub.innerHTML = esc(eq) + (ms.rrr?'  •  RRR '+ms.rrr:'');
    } else if (p.cur===1){
      sub.innerHTML='<span class="liveDot"></span>First Innings';
    } else {
      sub.innerHTML='<span class="liveDot"></span>Live';
    }
    bar.classList.add("show");
  }

  function showMsg(msg){
    $("bat").innerHTML=""; $("bowl").innerHTML="";
    $("pill").innerHTML='<div class="sc"><span class="score">—</span></div>';
    $("csub").className="csub"; $("csub").innerHTML=esc(msg||"");
    bar.classList.add("show");
  }

  // ---- end-of-match detection + full scorecard ----
  function isEnded(d){
    var ms=d.match_summary||{};
    return d.status==="past" ||
      /won by|match tied|tied|drawn|abandoned|no result/i.test(ms.ticker_summary||ms.summary||"");
  }
  var cardShown=false;
  function enterScorecard(d){
    if (cardShown) return;
    cardShown=true;
    bar.classList.remove("show");
    var ms=d.match_summary||{};
    var resultText = ms.ticker_summary || ms.summary || "";
    fetch(apiBase+"sc/"+encodeURIComponent(matchId),{cache:"no-store"})
      .then(function(r){ return r.json(); })
      .then(function(j){ if (j&&j.status&&j.data) renderScorecard(j.data, resultText); })
      .catch(function(){});
  }
  function scLine(n, v){ return '<div class="sc-line"><span class="n">'+n+'</span><span class="v">'+v+'</span></div>'; }
  function inningsBlock(team){
    var sc=(team.scorecard&&team.scorecard[0])||{}, inn=(team.innings&&team.innings[0])||{};
    var bats=(sc.batting||[]).slice().sort(function(a,b){return (b.runs||0)-(a.runs||0);}).slice(0,5);
    var bowls=(sc.bowling||[]).slice().sort(function(a,b){
      return (b.wickets||0)-(a.wickets||0) || (a.runs||0)-(b.runs||0); }).slice(0,4);
    var batHtml=bats.map(function(pl){
      var star=/not out/i.test(pl.how_to_out||"")?' <b style="color:#14b4a4">*</b>':'';
      return scLine(fitName(pl.name)+star,(pl.runs||0)+' <small>('+(pl.balls||0)+')</small>');
    }).join('');
    var bowlHtml=bowls.map(function(pl){
      return scLine(fitName(pl.name),(pl.wickets||0)+'-'+(pl.runs||0)+' <small>('+(pl.overs!=null?pl.overs:0)+')</small>');
    }).join('');
    var total=(inn.total_run!=null?inn.total_run:0)+'/'+(inn.total_wicket!=null?inn.total_wicket:0)
              +' ('+(inn.overs_played!=null?inn.overs_played:0)+')';
    var src=logoSrc(team);
    var logoTag= src? '<img src="'+esc(src)+'" alt="">' : '<div class="ini" style="background:#262c70">'+abbr(team.name,team.short_name)+'</div>';
    return '<div class="sc-inn"><div class="sc-tm">'+logoTag
      +'<span class="nm">'+esc(team.name)+'</span><span class="tot">'+total+'</span></div>'
      +'<div class="sc-cols"><div class="sc-bat"><div class="sc-h">Batting</div>'+batHtml+'</div>'
      +'<div class="sc-bowl"><div class="sc-h">Bowling</div>'+bowlHtml+'</div></div></div>';
  }
  function renderScorecard(full, banner, isNote, isSplash){
    var teams=[full.team_a, full.team_b].filter(function(t){ return t && t.innings && t.innings.length; });
    teams.sort(function(a,b){
      return ((a.innings[0].inning)||9)-((b.innings[0].inning)||9); });
    var head='<div class="sc-head"><span class="t">'+esc(full.tournament_name||"")+'</span>'
      +'<span class="r">'+esc(full.tournament_round_name||"")+'</span></div>';
    var res= banner? '<div class="'+(isNote?"sc-note":"sc-result")+'">'+esc(banner)+'</div>':'';
    var el=$("scorecard");
    el.classList.toggle("splash", !!isSplash);
    el.innerHTML='<div class="sc-card">'+head+res+teams.map(inningsBlock).join('')+'</div>';
    el.classList.add("show");
  }

  // ---- full-innings card: every batter on top, that innings' bowling below ----
  function innEntry(team, inn){
    var s=(team.scorecard||[]).filter(function(x){ return x.inning===inn; })[0];
    var i=(team.innings||[]).filter(function(x){ return x.inning===inn; })[0];
    return s ? {sc:s, inn:i||{}} : null;
  }
  // team batting in innings `inn` (its scorecard entry holds the opposition's bowling)
  function battingTeamOf(full, inn){
    var a=innEntry(full.team_a, inn);
    if (a) return {team:full.team_a, e:a};
    var b=innEntry(full.team_b, inn);
    return b ? {team:full.team_b, e:b} : null;
  }
  function renderFullCard(full, banner, curInn){
    var bt=battingTeamOf(full, curInn);
    if (!bt){ renderScorecard(full, banner, true, true); return; }
    var sc=bt.e.sc, inn=bt.e.inn;
    var batHead='<div class="sc-th"><span class="pn">Batting</span><span class="sc-c">R</span>'
      +'<span class="sc-c">B</span><span class="sc-c">4s</span><span class="sc-c">6s</span>'
      +'<span class="sc-c w">SR</span></div>';
    var batRows=(sc.batting||[]).map(function(pl){
      var out=pl.how_to_out_short_name||pl.how_to_out||"";
      var no=/not out/i.test(out);
      return '<div class="sc-tr"><span class="pn">'+fitName(pl.name)
        +'<small'+(no?' class="no"':'')+'>'+esc(out)+'</small></span>'
        +'<span class="sc-c">'+(pl.runs||0)+'</span><span class="sc-c">'+(pl.balls||0)+'</span>'
        +'<span class="sc-c">'+(pl["4s"]||0)+'</span><span class="sc-c">'+(pl["6s"]||0)+'</span>'
        +'<span class="sc-c w">'+esc(pl.SR||"0.00")+'</span></div>';
    }).join('');
    var ex=sc.extras||{};
    var total=(inn.total_run!=null?inn.total_run:0)+'/'+(inn.total_wicket!=null?inn.total_wicket:0)
      +' ('+(inn.overs_played!=null?inn.overs_played:0)+' ov)';
    var xtr='<div class="sc-xtr"><span><span class="lbl">Extras</span>'+(ex.total||0)
      +' <small>'+esc(ex.summary||"")+'</small></span>'
      +'<span><span class="lbl">Total</span>'+total+'</span></div>';
    var ytb=(sc.to_be_bat||[]).map(function(p){ return p.name; }).join(", ");
    var ytbHtml= ytb? '<div class="sc-ytb"><b>Yet to bat:</b> '+esc(ytb)+'</div>':'';
    var bowlHead='<div class="sc-th"><span class="pn">Bowling</span><span class="sc-c w">O</span>'
      +'<span class="sc-c">M</span><span class="sc-c">R</span><span class="sc-c">W</span>'
      +'<span class="sc-c w">Eco</span></div>';
    var bowlRows=(sc.bowling||[]).map(function(pl){
      return '<div class="sc-tr"><span class="pn">'+fitName(pl.name)+'</span>'
        +'<span class="sc-c w">'+(pl.overs!=null?pl.overs:0)+'</span><span class="sc-c">'+(pl.maidens||0)+'</span>'
        +'<span class="sc-c">'+(pl.runs||0)+'</span><span class="sc-c">'+(pl.wickets||0)+'</span>'
        +'<span class="sc-c w">'+esc(pl.economy_rate||"0.00")+'</span></div>';
    }).join('');
    var src=logoSrc(bt.team);
    var logoTag= src? '<img src="'+esc(src)+'" alt="">'
      : '<div class="ini" style="background:#262c70">'+abbr(bt.team.name,bt.team.short_name)+'</div>';
    var head='<div class="sc-head"><span class="t">'+esc(full.tournament_name||"")+'</span>'
      +'<span class="r">'+esc(full.tournament_round_name||"")+'</span></div>';
    var res= banner? '<div class="sc-note">'+esc(banner)+'</div>':'';
    var el=$("scorecard");
    el.classList.add("splash");
    el.innerHTML='<div class="sc-card">'+head+res
      +'<div class="sc-sec"><div class="sc-tm">'+logoTag+'<span class="nm">'+esc(bt.team.name)
      +'</span><span class="tot">'+total+'</span></div>'+batHead+batRows+xtr+ytbHtml+'</div>'
      +'<div class="sc-sec">'+bowlHead+bowlRows+'</div></div>';
    el.classList.add("show");
  }

  // ---- worm graph: cumulative runs per over, wickets from fall_of_wicket ----
  var WORM_COLORS=["#d63b6e","#0f8d81"];
  // FOW/ball labels: X.1..X.5 then (X+1).0 all belong to over X+1's group
  function overOfLabel(o){ return (o%1===0)? o : Math.floor(o)+1; }
  function wormSeries(full, cm){
    var series=[];
    [1,2].forEach(function(innNo){
      var bt=battingTeamOf(full, innNo);
      if (!bt) return;
      var balls=(cm.commentary||[]).filter(function(b){ return b.inning===innNo; })
        .map(function(b){ return {lab:parseFloat(b.ball)||0, ov:b.current_over||overOfLabel(parseFloat(b.ball)||0),
                                  r:(b.run||0)+(b.extra_run||0)}; });
      if (!balls.length) return;
      // wicket balls are absent from commentary — rebuild them from fall_of_wicket,
      // whose cumulative score at each wicket is exact
      var fow=((bt.e.sc.fall_of_wicket||{}).data||[]).slice()
        .sort(function(a,b){ return a.over-b.over; });
      fow.forEach(function(w){
        var before=0;
        balls.forEach(function(b){ if (b.lab < w.over) before+=b.r; });
        balls.push({lab:w.over, ov:overOfLabel(w.over), r:Math.max(0,(w.run||0)-before), wkt:true});
      });
      var perOver={}, maxOver=0;
      balls.forEach(function(b){ perOver[b.ov]=(perOver[b.ov]||0)+b.r; if (b.ov>maxOver) maxOver=b.ov; });
      var pts=[[0,0]], cum=0;
      for (var o=1;o<=maxOver;o++){ cum+=perOver[o]||0; pts.push([o,cum]); }
      var wkts=fow.map(function(w){
        var o=w.over, x=(o%1===0)? o : Math.floor(o)+((o*10)%10)/6;
        return [x, w.run||0];
      });
      series.push({name:bt.team.name, pts:pts, wkts:wkts, total:cum, maxOver:maxOver});
    });
    return series;
  }
  function renderWorm(full, cm, banner){
    var series=wormSeries(full, cm);
    if (!series.length){ return false; }
    var maxX=Math.max.apply(null, series.map(function(s){ return s.maxOver; }).concat([1]));
    var maxY=Math.max.apply(null, series.map(function(s){ return s.total; }).concat([10]));
    var steps=[5,10,20,25,50,100], yStep=steps[steps.length-1];
    for (var i=0;i<steps.length;i++){ if (maxY/steps[i]<=5){ yStep=steps[i]; break; } }
    var yTop=Math.ceil(maxY/yStep)*yStep || yStep;
    var W=1000,H=380,L=52,R=18,T=14,B=38;
    var X=function(o){ return L+(W-L-R)*o/maxX; };
    var Y=function(r){ return T+(H-T-B)*(1-r/yTop); };
    var g='';
    for (var yv=0;yv<=yTop;yv+=yStep){
      g+='<line x1="'+L+'" y1="'+Y(yv)+'" x2="'+(W-R)+'" y2="'+Y(yv)+'" stroke="rgba(20,24,29,.18)"'
        +(yv?' stroke-dasharray="4 5"':'')+' stroke-width="1"/>'
        +'<text x="'+(L-8)+'" y="'+(Y(yv)+4)+'" text-anchor="end" font-size="13" fill="#7c828c">'+yv+'</text>';
    }
    var xStep= maxX>30?5: maxX>16?2:1;
    for (var xv=xStep;xv<=maxX;xv+=xStep){
      g+='<text x="'+X(xv)+'" y="'+(H-B+20)+'" text-anchor="middle" font-size="13" fill="#7c828c">'+xv+'</text>';
    }
    g+='<text x="'+((L+W-R)/2)+'" y="'+(H-3)+'" text-anchor="middle" font-size="11" fill="#aeb6c2" '
      +'letter-spacing="1">OVERS</text>'
      +'<text x="14" y="'+((T+H-B)/2)+'" text-anchor="middle" font-size="11" fill="#aeb6c2" '
      +'letter-spacing="1" transform="rotate(-90 14 '+((T+H-B)/2)+')">RUNS</text>';
    var legend='';
    series.forEach(function(s,idx){
      var c=WORM_COLORS[idx%WORM_COLORS.length];
      g+='<polyline fill="none" stroke="'+c+'" stroke-width="3.5" stroke-linejoin="round" '
        +'stroke-linecap="round" points="'
        +s.pts.map(function(p){ return X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1); }).join(' ')+'"/>';
      s.wkts.forEach(function(p){
        g+='<circle cx="'+X(p[0]).toFixed(1)+'" cy="'+Y(p[1]).toFixed(1)
          +'" r="5" fill="#fff" stroke="'+c+'" stroke-width="2.5"/>';
      });
      legend+='<span><i style="background:'+c+'"></i>'+esc(s.name)+'</span>';
    });
    var head='<div class="sc-head"><span class="t">'+esc(full.tournament_name||"")+'</span>'
      +'<span class="r">'+esc(full.tournament_round_name||"")+'</span></div>';
    var res= banner? '<div class="sc-note">'+esc(banner)+'</div>':'';
    var el=$("scorecard");
    el.classList.add("splash");
    el.innerHTML='<div class="sc-card">'+head+res+'<div class="sc-worm"><div class="lg">'+legend+'</div>'
      +'<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+g+'</svg></div></div>';
    el.classList.add("show");
    return true;
  }

  // Detect a wicket (batting wickets up) or a completed over; returns a reason
  // string once per event, updating baselines. Resets on an innings change.
  function detectTriggers(d){
    var p=pick(d), bi=p.batInn||{};
    var w=parseInt(bi.total_wicket||0,10)||0;
    var completed=Math.floor(parseFloat(bi.overs_played||0)||0);
    if (seenInn !== p.cur){ seenInn=p.cur; baseWkt=w; baseOver=completed; return null; }
    var reason=null;
    if (w>baseWkt) reason="Wicket!";
    else if (completed>baseOver) reason="End of over "+completed;
    baseWkt=w; baseOver=completed;
    return reason;
  }
  function getJson(path){
    return fetch(apiBase+path,{cache:"no-store"})
      .then(function(r){ return r.json(); })
      .then(function(j){ return (j&&j.status&&j.data)? j.data : null; })
      .catch(function(){ return null; });
  }
  var phaseTimers=[];
  function clearPhases(){ phaseTimers.forEach(clearTimeout); phaseTimers=[]; }
  // Splash phases — 1st innings: full card the whole time.  2nd innings:
  // full card 10s, both-teams summary 5s, worm graph for whatever is left
  // (cardsecs=15 -> no time left, worm skipped).
  function triggerCard(reason, d){
    var start=Date.now();
    cardUntil = start+cardSecs;        // bar stays visible; splash overlays above it
    clearPhases();
    var cur=pick(d).cur;
    Promise.all([
      getJson("sc/"+encodeURIComponent(matchId)),
      cur>=2 ? getJson("cm/"+encodeURIComponent(matchId)) : Promise.resolve(null)
    ]).then(function(res){
      var full=res[0], cm=res[1];
      if (!full || Date.now()>=cardUntil) return;
      if (cur<2){ renderFullCard(full, reason, cur); return; }
      var fullMs=Math.min(10000, cardSecs);
      var sumMs=Math.min(5000, cardSecs-fullMs);
      var wormMs=cardSecs-fullMs-sumMs;
      if (wormMs<5000 || !cm) wormMs=0;   // too short (or no data) -> summary runs out the clock
      renderFullCard(full, reason, cur);
      var at=function(ms,fn){ phaseTimers.push(setTimeout(fn, Math.max(0, start+ms-Date.now()))); };
      if (sumMs>0) at(fullMs, function(){ renderScorecard(full, reason, true, true); });
      if (wormMs>0) at(fullMs+sumMs, function(){ renderWorm(full, cm, reason); });
    });
  }

  // ?card=full|summary|worm -> freeze that view for styling checks (needs a
  // match with data; skips the live trigger/rotation logic entirely)
  var debugCard=(q.get("card")||"").toLowerCase(), debugShown=false;
  function showDebugCard(d){
    if (debugShown) return; debugShown=true;
    cardUntil=Infinity;
    Promise.all([getJson("sc/"+encodeURIComponent(matchId)), getJson("cm/"+encodeURIComponent(matchId))])
      .then(function(res){
        var full=res[0], cm=res[1];
        if (!full) return;
        var cur=parseInt(q.get("inn")||"",10) || d.current_inning || 2;
        if (debugCard==="full") renderFullCard(full, "Preview", cur);
        else if (debugCard==="worm") renderWorm(full, cm||{}, "Preview");
        else renderScorecard(full, "Preview", true, true);
      });
  }

  function tick(){
    fetch(apiBase+encodeURIComponent(matchId),{cache:"no-store"})
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (!(j && j.status && j.data)) { showMsg((j&&j.error&&j.error.message)||"match not live"); return; }
        var d=j.data;
        if (debugCard){ render(d); showDebugCard(d); return; }
        if (isEnded(d)) { enterScorecard(d); return; }
        var reason = autoCard ? detectTriggers(d) : null;
        if (reason) triggerCard(reason, d);
        render(d);                              // live bar stays visible throughout
        if (Date.now() >= cardUntil){ clearPhases(); $("scorecard").classList.remove("show", "splash"); }
      })
      .catch(function(e){ showMsg(String(e)); });
  }
  function loadJson(u){ return fetch(u,{cache:"force-cache"})
    .then(function(r){ return r.ok ? r.json() : {}; }).catch(function(){ return {}; }); }
  Promise.all([
    loadJson("assets/team-logos/manifest.json"),
    loadJson("assets/tournaments/data/divisions.json")
  ]).then(function(res){ LOGOS=res[0]||{}; DIVMAP=res[1]||{}; })
    .then(function(){ tick(); setInterval(tick, refresh); });
})();
</script>
</body>
</html>
