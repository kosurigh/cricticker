<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Divisions — Cric Scenarios</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230d1117%27/%3E%3Cpath d=%27M7 25h4v-9H7zm7 0h4V10h-4zm7 0h4V5h-4z%27 fill=%27%233fb950%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="crumbs" id="crumbs"></div>
    <h1 id="title">Tournament</h1>
    <p class="sub" id="subtitle"></p>
  </div>
</header>

<div class="wrap">
  <h2>Divisions</h2>
  <div class="divs" id="divs"><p class="sub">Loading…</p></div>

  <h3>Rules used for this tournament</h3>
  <div id="rules" class="panelbox"></div>

  <footer class="foot">
    Data from <a href="https://cricheroes.com/">CricHeroes</a>. Unofficial.
  </footer>
</div>

<script type="module">
import { esc, breadcrumbs, query, fmtWhen } from './assets/js/ui.js';
import { fetchLiveProgress, progressLabel } from './assets/js/overview.js';

const tid = query().get('t') || '2100677';

document.getElementById('crumbs').innerHTML = breadcrumbs([
  { label: 'Tournaments', href: 'index.html' },
  { label: 'Divisions' },
]);

/**
 * What is known about each division's snapshot.
 *
 * index.json is written by both tools/fetch-tournament.mjs and
 * tools/make-placeholder.mjs, so the card can say whether the data behind a
 * division is real or invented without downloading nine snapshots to find out.
 * Falls back to a HEAD probe when no index has been generated yet.
 */
async function snapshotIndex(divisions) {
  try {
    const r = await fetch(`assets/data/${tid}/index.json`, { cache: 'no-cache' });
    if (r.ok) {
      const body = await r.json();
      return new Map((body.divisions || []).map((d) => [d.division, d]));
    }
  } catch { /* fall through to probing */ }

  const probed = await Promise.all(divisions.map(async (d) => {
    try {
      const r = await fetch(`assets/data/${tid}/division-${d}.json`, { method: 'HEAD' });
      return r.ok ? [d, { division: d }] : null;
    } catch { return null; }
  }));
  return new Map(probed.filter(Boolean));
}

(async () => {
  let meta;
  try {
    meta = await (await fetch(`assets/data/${tid}/meta.json`, { cache: 'no-cache' })).json();
  } catch {
    document.getElementById('divs').innerHTML =
      `<div class="banner err"><div><strong>Unknown tournament</strong>
       <p>No <code>assets/data/${esc(tid)}/meta.json</code> in this build.</p></div></div>`;
    return;
  }

  document.title = `${meta.name} — Cric Scenarios`;
  document.getElementById('title').textContent = meta.name;
  document.getElementById('subtitle').textContent =
    `${meta.organiser || ''} · ${(meta.divisions || []).length} divisions`;

  const r = meta.rules || {};
  const ov = r.division_overrides || {};
  const without = (k) => Object.keys(ov).filter((d) => ov[d][k] === 0).map((d) => `Division ${d}`);
  const noUp = without('promotion_spots'), noDown = without('relegation_spots');
  const names = { points: 'points', wins: 'most wins', nrr: 'net run rate', h2h: 'head-to-head (wins over the other tied teams)' };
  const order = (r.tiebreak || []).map((k) => names[k] || k);
  document.getElementById('rules').innerHTML = `
    <ul class="reqs">
      <li><span class="mark ok">▲</span><span>Top <b>${r.promotion_spots}</b> are
        <strong>promoted</strong> to the division above${noUp.length ? ` (not in ${noUp.join(', ')}, the top division)` : ''}.</span></li>
      <li><span class="mark maybe">◆</span><span>Top <b>${r.playoff_spots}</b> reach the
        <strong>championship playoffs</strong>.</span></li>
      <li><span class="mark no">▼</span><span>Bottom <b>${r.relegation_spots}</b> are
        <strong>relegated</strong> to the division below${noDown.length ? ` (not in ${noDown.join(', ')}, the bottom division)` : ''}.</span></li>
      <li><span class="mark">·</span><span>A win is <b>${r.points_win}</b> points,
        a tie, no result or abandoned match <b>${r.points_tie}</b>. Places are decided by
        <b>${order.join(' → ')}</b>, then the previous season's ranking or a coin toss.</span></li>
    </ul>
    <blockquote class="note" style="margin:8px 0;padding-left:10px;border-left:3px solid var(--line,#ddd)">
      <b>TCL HT League Handbook, 16.10.5:</b> "In the event of teams finishing on equal points in the league stage …
      The team with the greatest number of wins in the league matches will be placed in the higher position.
      If there are teams with equal points and equal wins in the league matches, then in such case the teams will be
      ordered according to their net run rate (NRR) … If there are teams with equal points, equal wins and equal NRR …
      ordered according to the team with the most number of wins over the other such team(s). If two or more teams are
      still equal, then … ordered according to their previous season rankings after league stage. This will be replaced
      by coin toss if the tournament format is new and last season rankings cannot be used."
    </blockquote>
    <p class="note"><b>CricHeroes disagrees in places.</b> Its published points table sorts teams level on points by net
      run rate first, so a team with more wins but a lower net run rate appears below where the handbook puts it. This site
      follows the handbook. The last step (previous season / coin toss) is not modelled: where it would decide a place the
      page says so and never calls a team through or out on it.</p>
    ${meta.rules_note ? `<p class="note">${esc(meta.rules_note)}</p>` : ''}`;

  const divisions = meta.divisions || [];
  const index = await snapshotIndex(divisions);

  // First paint from the committed index; then the live points table
  // replaces the counts, so the cards agree with what each division page shows.
  const render = (live) => {
    document.getElementById('divs').innerHTML = divisions.map((d) => {
      const info = index.get(d);
      const now = live && live.progress.get(d);
      let cls = '';
      let note = 'No snapshot yet';
      if (info && info.placeholder) {
        cls = ' sample';
        note = info.remaining != null ? `Sample data · ${info.remaining} to play` : 'Sample data';
      } else if (now && now.remaining != null) {
        cls = now.complete ? ' ready complete' : ' ready';
        note = progressLabel(now);
      } else if (info) {
        cls = ' ready';
        note = info.remaining != null
          ? `${progressLabel({ ...info, total: info.matches })} · snapshot ${fmtWhen(info.generated_at)}`
          : 'Data available';
      }
      return `
      <a class="divcard${cls}" href="division.html?t=${encodeURIComponent(tid)}&d=${d}">
        <div class="n">Division ${d}</div>
        <div class="d">${esc(note)}</div>
      </a>`;
    }).join('');
    const status = document.getElementById('divstatus');
    if (status) {
      status.innerHTML = live
        ? `<span class="badge live"><span class="dot"></span>Live · ${esc(fmtWhen(live.fetchedAt))}</span>` +
          (live.scheduleChanged
            ? ` <span class="badge warn">CricHeroes now lists ${live.advertised} matches — fixture totals are from the last snapshot; open a division for exact counts</span>`
            : '')
        : '<span class="badge">Snapshot</span>';
    }
  };
  document.getElementById('divs').insertAdjacentHTML('beforebegin', '<p id="divstatus" class="meta"></p>');
  render(null);

  const totals = new Map(divisions.map((d) => [d, index.get(d)?.matches ?? null]));
  try {
    const mapAll = await (await fetch('assets/data/divisions.json', { cache: 'force-cache' })).json();
    const live = await fetchLiveProgress(tid, mapAll[String(tid)], totals);
    if (live) render(live);
  } catch { /* keep the snapshot figures */ }

  if ([...index.values()].some((d) => d.placeholder)) {
    document.getElementById('divs').insertAdjacentHTML('beforebegin',
      `<div class="banner"><div><strong>Divisions marked "Sample data" hold invented results</strong>
       <p>Real team rosters, made-up matches. Every calculation is correct; the matches are not.
       Replace them all with <code>node tools/fetch-tournament.mjs ${esc(tid)}</code>.</p></div></div>`);
  }
})();
</script>
</body>
</html>
